name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-progress
      - name: Check formatting (ruff format)
        run: uv run ruff format --check .
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Type check (ty)
        run: uv run ty check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-progress
      - name: Run tests (pytest)
        run: uv run pytest -q
